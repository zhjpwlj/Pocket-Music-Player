<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pocket Music Player</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pocket" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <span class="app-mark">Pocket</span>
        <span class="app-badge">M2</span>
      </header>
      <main class="app-main">
        <h1>Player broker proof</h1>
        <p class="app-copy">
          Pick a track, play it, then swap the active element without a gap.
        </p>
        <input id="m2-file" type="file" accept="audio/*" />
        <div id="player-container"></div>
        <div class="m2-actions">
          <button id="m2-load" type="button">Load &amp; Play</button>
          <button id="m2-swap" type="button">Swap to other element</button>
          <button id="m2-toggle" type="button">Pause</button>
        </div>
        <label class="m1-seek-label" for="m2-seek">Seek</label>
        <input id="m2-seek" type="range" min="0" max="30" step="0.1" value="0" />
        <p id="m2-status" role="status" aria-live="polite">Ready.</p>
      </main>
      <span id="app-version" class="app-version"></span>
      <pre id="debug-log" class="debug-log" hidden></pre>
    </div>
    <script type="module" src="/main.js"></script>
    <script type="module" src="/m2-dev.js"></script>
  </body>
</html>
